<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Pencatatan Keuangan</title>
<style>
:root{--bg:#f3f6fb;--card:#fff;--text:#101828;--muted:#667085;--line:#e4e7ec;--primary:#2563eb;--primary2:#1d4ed8;--green:#079455;--red:#d92d20;--orange:#dc6803;--soft:#eef4ff;--shadow:0 12px 30px rgba(16,24,40,.08);--radius:20px;--safe:env(safe-area-inset-bottom,0px)}
body[data-theme=dark]{--bg:#07111f;--card:#101828;--text:#f9fafb;--muted:#98a2b3;--line:#263449;--primary:#60a5fa;--primary2:#3b82f6;--green:#32d583;--red:#f97066;--orange:#fdb022;--soft:#18283d;--shadow:0 14px 35px rgba(0,0,0,.34)}
body[data-theme=pink]{--bg:#fff1f7;--card:#fff;--text:#3b1022;--muted:#8a5269;--line:#ffd0e2;--primary:#db2777;--primary2:#be185d;--green:#079455;--red:#d92d20;--orange:#dc6803;--soft:#fce7f3;--shadow:0 14px 35px rgba(219,39,119,.12)}
*{box-sizing:border-box}html,body{min-height:100%;max-width:100%;overflow-x:hidden}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}
button,input,select,textarea{font:inherit}button{border:0;cursor:pointer}.hide{display:none!important}h1,h2,h3,p{margin:0}
.small{font-size:12px;color:var(--muted);line-height:1.45}.muted{color:var(--muted);font-size:13px}.green{color:var(--green)}.red{color:var(--red)}.blue{color:var(--primary)}.orange{color:var(--orange)}
.app{min-height:100svh;padding:14px 14px calc(82px + var(--safe))}
.top{display:grid;grid-template-columns:1fr;gap:10px;margin-bottom:12px}.top-main{display:flex;align-items:center;justify-content:space-between;gap:10px}.top-left{display:flex;align-items:center;gap:11px;min-width:0}.top h2{font-size:19px}.top-actions{display:flex;justify-content:flex-end;gap:8px;align-items:center}
.input{width:100%;max-width:100%;border:1px solid var(--line);border-radius:13px;padding:11px 13px;background:var(--card);color:var(--text);outline:0;min-height:44px}.input:focus{border-color:var(--primary);box-shadow:0 0 0 4px color-mix(in srgb,var(--primary) 15%,transparent)}
.btn{width:100%;border-radius:13px;padding:11px 15px;background:var(--primary);color:#fff;font-weight:900;min-height:44px}.btn:active{transform:scale(.99)}.btn-lite{background:var(--soft);color:var(--primary)}.btn-mini{width:auto;min-height:38px;padding:8px 11px;border-radius:11px;font-size:12px}
.menu{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin:0 auto 12px;max-width:400px}.menu-btn{border-radius:14px;padding:10px 5px;background:var(--card);border:1px solid var(--line);color:var(--muted);font-size:13px;font-weight:950}.menu-btn.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.wrap{display:grid;gap:12px}.view{display:none;gap:12px}.view.active{display:grid}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;min-width:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat .label{font-size:11px;color:var(--muted);font-weight:900}.stat .num{font-size:17px;font-weight:950;margin-top:8px;word-break:break-word}.section-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.section-title h3{font-size:17px}.filters{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}.chip{padding:9px 8px;border-radius:999px;background:var(--soft);color:var(--muted);font-weight:950;font-size:12px}.chip.active{background:var(--primary);color:#fff}
.stack{display:grid;gap:12px}.limit-box{display:grid;gap:10px;padding:12px;border:1px solid var(--line);border-radius:17px;background:var(--bg)}.progress{height:10px;border-radius:999px;background:var(--line);overflow:hidden}.bar{height:100%;width:0;background:var(--primary)}.bar.warn{background:var(--orange)}.bar.danger{background:var(--red)}
.inline-form{display:grid;grid-template-columns:1fr;gap:8px}.field{display:grid;gap:6px;margin-bottom:10px}.field label{font-size:12px;font-weight:900}.table-wrap{width:100%;max-width:100%;overflow:auto;border:1px solid var(--line);border-radius:15px;-webkit-overflow-scrolling:touch}.data-table{width:100%;min-width:400px;border-collapse:separate;border-spacing:0;background:var(--card)}.data-table th,.data-table td{padding:11px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);text-align:left;vertical-align:middle;font-size:12px}.data-table th{background:#111827;color:#fff;font-weight:950;position:sticky;top:0;z-index:2}.data-table tr:last-child td{border-bottom:0}
.table-mobile-shell{position:relative}.pill{display:inline-flex;align-items:center;justify-content:center;border-radius:999px;padding:5px 9px;font-weight:950;font-size:11px}.pill.in{background:#dcfae6;color:#067647}.pill.out{background:#fee4e2;color:#b42318}.pill.sisa{background:#dbeafe;color:#1d4ed8}.empty{padding:24px;text-align:center;color:var(--muted)}
.pager{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px}.pager-info{font-size:12px;color:var(--muted);font-weight:900;text-align:center}.footer{max-width:1180px;margin:14px auto 0;text-align:center;color:var(--muted);font-size:12px;line-height:1.6}
.toast{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:#111827;color:#fff;border-radius:999px;padding:12px 17px;box-shadow:var(--shadow);z-index:60;max-width:92%;text-align:center;font-size:13px;font-weight:900}.loader{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:11px 17px;box-shadow:var(--shadow);z-index:55;font-size:13px;font-weight:950}
@media (max-width:699px){.app{padding-left:12px;padding-right:12px}.top,.wrap{width:100%;max-width:480px;margin-left:auto;margin-right:auto}.card{overflow:hidden}.table-card{overflow:visible}.table-card .table-wrap{max-height:430px;touch-action:pan-x pan-y}.data-table th:first-child,.data-table td:first-child{display:none}.data-table th,.data-table td{padding:10px 9px;font-size:11px}}
@media (min-width:700px){.app{padding:18px 18px 24px}.top{max-width:1180px;margin:0 auto 14px;grid-template-columns:1fr auto}.wrap{max-width:1180px;margin:0 auto}.grid{grid-template-columns:repeat(4,1fr)}.stat .label{font-size:13px}.stat .num{font-size:25px}.card{padding:18px}.stack.two{grid-template-columns:360px 1fr}.data-table{width:100%}}
</style>
</head>
<body>
<section id="main" class="app">
  <div class="top">
    <div class="top-main"><div class="top-left"><div><h2>Pencatatan</h2><p class="muted" id="monthText">Memuat...</p></div></div></div>
    <div class="top-actions">
      <input class="input" id="monthPicker" type="month" onchange="window.loadDashboard()" style="max-width:160px">
      <!-- Tombol Login (Akan berubah menjadi Logout jika sudah masuk) -->
      <button type="button" class="btn btn-lite btn-mini" id="loginBtn" onclick="window.loginAdmin()">Login</button>
      <button type="button" class="btn btn-lite btn-mini" id="themeBtn" onclick="window.cycleTheme()" title="Ganti tema">☀️</button>
    </div>
  </div>

  <nav class="menu">
    <button class="menu-btn active" id="menuHome" onclick="window.setView('home')">Beranda</button>
    <!-- Menu Input disembunyikan secara bawaan dengan class "hide" -->
    <button class="menu-btn hide" id="menuInput" onclick="window.setView('input')">Input</button>
  </nav>

  <div class="wrap">
    <section id="viewHome" class="view active">
      <div class="grid">
        <div class="card stat"><div class="label">Sisa Sebelumnya</div><div class="num blue" id="openingNum">Rp0</div></div>
        <div class="card stat"><div class="label">Masuk</div><div class="num green" id="incomeNum">Rp0</div></div>
        <div class="card stat"><div class="label">Keluar</div><div class="num red" id="expenseNum">Rp0</div></div>
        <div class="card stat"><div class="label">Total</div><div class="num" id="totalNum">Rp0</div></div>
      </div>
      <div class="card table-card">
        <div class="section-title"><div><h3>Data Transaksi</h3></div><button class="btn btn-lite btn-mini" onclick="window.loadDashboard()">Refresh</button></div>
        <div class="filters">
          <button class="chip active" id="filterAll" onclick="window.setFilter('all')">Semua</button>
          <button class="chip" id="filterMasuk" onclick="window.setFilter('masuk')">Masuk</button>
          <button class="chip" id="filterKeluar" onclick="window.setFilter('keluar')">Keluar</button>
        </div>
        <div class="table-mobile-shell">
          <div class="table-wrap" id="tableWrap">
            <table class="data-table">
              <thead><tr><th>Waktu</th><th>Jenis</th><th>Nama</th><th>Nominal</th></tr></thead>
              <tbody id="trxBody"></tbody>
            </table>
          </div>
        </div>
        <div id="empty" class="empty hide">Belum ada data.</div>
        <div class="pager" id="pager"><button class="btn btn-lite btn-mini" onclick="window.changePage(-1)">Sebelum</button><div class="pager-info" id="pagerInfo">Halaman 1</div><button class="btn btn-lite btn-mini" onclick="window.changePage(1)">Lanjut</button></div>
      </div>
    </section>

    <section id="viewInput" class="view">
      <div class="stack two">
        <div class="card stack">
          <div class="limit-box">
            <div class="section-title" style="margin:0"><div><h3>Batas Keluar</h3><p class="small" id="limitInfo">Belum ada limit.</p></div><button type="button" class="btn btn-lite btn-mini" onclick="window.requestNotify()">Notif</button></div>
            <div class="progress"><div id="limitBar" class="bar"></div></div>
            <form onsubmit="window.saveLimit(event)" class="inline-form"><input class="input" id="limitInput" inputmode="numeric" placeholder="Limit keluar per bulan"><button class="btn">Simpan Limit</button></form>
          </div>
          <form onsubmit="window.saveOpening(event)">
            <div class="field"><label>Sisa Sebelumnya</label><input class="input" id="openingInput" inputmode="numeric" placeholder="0" required></div>
            <button class="btn">Simpan Sisa</button><p class="small" id="nextInfo" style="margin-top:8px"></p>
          </form>
        </div>
        <div class="card">
          <form onsubmit="window.addTransaction(event)">
            <div class="field"><label>Jenis</label><select class="input" id="trxType"><option value="masuk">Masuk</option><option value="keluar">Keluar</option></select></div>
            <div class="field"><label>Nama</label><input class="input" id="trxName" placeholder="Gaji / Makan / Transport" required></div>
            <div class="field"><label>Nominal</label><input class="input" id="trxAmount" inputmode="numeric" placeholder="0" required></div>
            <button class="btn">Tambah Transaksi</button>
          </form>
        </div>
      </div>
    </section>
  </div>
  <footer class="footer">© Vercel + Supabase Migration</footer>
</section>

<div id="toast" class="toast hide"></div>
<div id="loader" class="loader hide">Memproses...</div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
